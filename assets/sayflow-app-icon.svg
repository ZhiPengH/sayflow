<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <title>言顺 SayFlow · App Icon 1024</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF3E2"/>
      <stop offset="100%" stop-color="#A6C4BC"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- macOS Big Sur+ squircle (rx = 22.37% × 1024 = 229) -->
  <rect width="1024" height="1024" rx="229" fill="url(#bg)"/>

  <!-- Top dot — the 点 of 言 -->
  <circle cx="512" cy="256" r="35" fill="#16242E"/>

  <!-- Three wavy horizontal lines, progressively widening -->
  <!-- Line 1 — 2 cycles, length 288 -->
  <path d="M 368 435 Q 404 393 440 435 T 512 435 T 584 435 T 656 435"
        fill="none" stroke="#16242E" stroke-width="35" stroke-linecap="round"/>

  <!-- Line 2 — 3 cycles, length 432 -->
  <path d="M 296 589 Q 332 547 368 589 T 440 589 T 512 589 T 584 589 T 656 589 T 728 589"
        fill="none" stroke="#16242E" stroke-width="35" stroke-linecap="round"/>

  <!-- Line 3 — 4 cycles, length 576 -->
  <path d="M 224 742 Q 260 700 296 742 T 368 742 T 440 742 T 512 742 T 584 742 T 656 742 T 728 742 T 800 742"
        fill="none" stroke="#16242E" stroke-width="35" stroke-linecap="round"/>

  <!-- Top highlight overlay -->
  <rect width="1024" height="1024" rx="229" fill="url(#shine)"/>

  <!-- Subtle inner edge -->
  <rect x="0.5" y="0.5" width="1023" height="1023" rx="228.5"
        fill="none" stroke="#000000" stroke-width="1" opacity="0.06"/>
</svg>
